# YOLOv8 + D-BRA dynamic sparse attention modules (Backbone Only)
# DBRA blocks only in backbone for enriched long-range context

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8-dbra.yaml' with scale 's'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# Backbone (with DBRA modules)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, DBRA, [128, 8, 8, 16]]  # c2=128, heads=8 (128/8=16 ✓)
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, DBRA, [256, 8, 8, 16]]  # c2=256, heads=8 (256/8=32 ✓)
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, DBRA, [512, 8, 8, 32]]  # c2=512, heads=8 (512/8=64 ✓)
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, DBRA, [1024, 8, 8, 32]]  # c2=1024, heads=8 (1024/8=128 ✓)
  - [-1, 1, SPPF, [1024, 5]] # 13

# Head (standard YOLOv8, no DBRA)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 19 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 22 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f, [1024]] # 25 (P5/32)

  - [[19, 22, 25], 1, Detect, [nc]] # Detect(P3, P4, P5)
